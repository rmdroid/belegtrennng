<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden · KI-Belegtrennung</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#151515">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141415; color: #fff;
      font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    main { max-width: 36rem; padding: 2rem; }
    p.k { font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    p.k::before { content: ""; display: inline-block; width: 22px; height: 2px; background: #d31238; vertical-align: middle; margin-right: .75rem; }
    h1 { font-weight: 400; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -.03em; line-height: 1.1; margin: 0 0 1.25rem; }
    p { color: rgba(255,255,255,.72); line-height: 1.6; }
    a { display: inline-block; margin-top: 1.5rem; background: #d31238; color: #fff; text-decoration: none; padding: .8rem 1.25rem; border-radius: 6px; font-weight: 500; }
    a:hover, a:focus-visible { background: #b50f30; }
  </style>
</head>
<body>
  <main>
    <p class="k">Fehler 404</p>
    <h1>Diese Seite gehört zu keinem Stapel.</h1>
    <p>Die aufgerufene Adresse gibt es nicht (mehr).</p>
    <a href="/" data-home>Zur Startseite</a>
  </main>
  <script>
    (function () {
      var seg = location.pathname.split("/")[1];
      if (/\.github\.io$/.test(location.hostname) && seg) {
        document.querySelector("[data-home]").setAttribute("href", "/" + seg + "/");
      }
    })();
  </script>
</body>
</html>
